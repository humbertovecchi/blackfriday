<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Programação WhatsApp</title>
<style>body{font:15px -apple-system,system-ui,sans-serif;background:#f6f4f0;color:#1c1915;display:grid;place-items:center;min-height:90vh;margin:0}p{color:#7a7268}</style></head>
<body><p id="m">Carregando…</p><script>
(async()=>{const m=document.getElementById('m');try{
const k=new URLSearchParams(location.hash.slice(1)).get('k');if(!k){m.textContent='Link incompleto: falta a chave.';return}
const b=await (await fetch('dados.txt?'+Date.now(),{cache:'no-store'})).text();
const raw=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));
if(new TextDecoder().decode(raw.slice(0,8))!=='Salted__')throw 0;
const salt=raw.slice(8,16),ct=raw.slice(16);
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(k),'PBKDF2',false,['deriveBits']);
const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},base,384));
const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct));
document.open();document.write(html);document.close();
}catch(e){m.textContent='Não foi possível abrir: chave inválida.'}})();
</script></body></html>
